<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact Your Name.">
  <title>Contact | Your Name</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<header class="site-header"><div class="container">
  <a class="logo" href="index.html">Your Name</a>
  <nav aria-label="Primary navigation"><ul>
    <li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li>
    <li><a href="projects.html">Projects</a></li><li><a aria-current="page" href="contact.html">Contact</a></li>
  </ul></nav>
</div></header>

<main id="main-content" class="section">
  <div class="container narrow">
    <h1>Contact Me</h1>
    <p>Have a project or question? Send me a message.</p>
    <form action="#" method="post" aria-describedby="form-help">
      <p id="form-help">All fields marked with <span aria-hidden="true">*</span> are required.</p>

      <div class="form-group">
        <label for="name">Full name <span aria-hidden="true">*</span></label>
        <input id="name" name="name" type="text" autocomplete="name" required aria-required="true">
      </div>

      <div class="form-group">
        <label for="email">Email address <span aria-hidden="true">*</span></label>
        <input id="email" name="email" type="email" autocomplete="email" required aria-required="true">
      </div>

      <div class="form-group">
        <label for="subject">Subject</label>
        <input id="subject" name="subject" type="text">
      </div>

      <div class="form-group">
        <label for="message">Message <span aria-hidden="true">*</span></label>
        <textarea id="message" name="message" rows="7" required aria-required="true"></textarea>
      </div>

      <button class="button" type="submit">Send message</button>
    </form>
  </div>
</main>

<footer class="site-footer"><div class="container"><p>&copy; 2026 Your Name. All rights reserved.</p></div></footer>
</body>
</html>
